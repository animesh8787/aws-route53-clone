# Render Blueprint for the API (free plan). The frontend is deployed separately on Vercel.
# NOTE: Render's free plan has no persistent disk, so the SQLite file is recreated and
# re-seeded whenever the service restarts. See the README (Deployment) for durable options.
services:
  - type: web
    name: route53-clone-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: DATABASE_URL # Turso: sqlite+libsql://<db-name>-<org>.turso.io?secure=true  (leave unset for ephemeral SQLite)
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GROQ_API_KEY # free key from console.groq.com; switches the Amazon Q panel on
        sync: false
      - key: CORS_ORIGINS
        sync: false # set to the Vercel URL, e.g. https://route53-clone.vercel.app
