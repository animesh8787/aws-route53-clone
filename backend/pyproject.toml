[project]
name = "route53-clone-backend"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 180
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "E501", "E731"]
"app/services/resources/kinds/*" = ["E501"]
"app/seed.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
log_level = "WARNING"
filterwarnings = ["ignore::DeprecationWarning"]
