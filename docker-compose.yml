# Local stack:  docker compose up --build   ->  http://localhost:3000  (demo@example.com / password)
services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/route53.db
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      SEED_ON_START: "true"
    volumes:
      - db-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  db-data:
